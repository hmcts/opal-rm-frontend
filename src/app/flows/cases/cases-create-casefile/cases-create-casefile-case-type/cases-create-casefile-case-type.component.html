<div class="govuk-grid-column-two-thirds">
  @if (cancelNavigationFailed()) {
    <div
      #cancelError
      id="create_casefile_case_type_cancel_error"
      class="govuk-error-summary"
      role="alert"
      tabindex="-1"
      aria-labelledby="create_casefile_case_type_cancel_error_title"
    >
      <h2 id="create_casefile_case_type_cancel_error_title" class="govuk-error-summary__title">There is a problem</h2>
      <p class="govuk-body">The page could not be opened. Try again.</p>
    </div>
  }
  <app-cases-create-casefile-case-type-form
    [initialFormData]="initialFormData"
    [focusHeading]="focusHeadingOnArrival"
    (formSubmit)="handleFormSubmit($event)"
    (unsavedChanges)="handleUnsavedChanges($event)"
    (cancel)="handleCancel()"
  />
</div>
