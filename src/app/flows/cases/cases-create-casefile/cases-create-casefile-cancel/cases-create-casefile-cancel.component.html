<div class="govuk-grid-column-two-thirds">
  <h1 #heading id="create_casefile_cancel_heading" class="govuk-heading-l" tabindex="-1">Cancel case creation</h1>
  <p id="create_casefile_cancel_warning" class="govuk-body">
    If you continue, all of the details added for this case will be lost.
  </p>
  @if (navigationFailed()) {
    <p #navigationError id="create_casefile_cancel_error" class="govuk-error-message" role="alert" tabindex="-1">
      The next page could not be opened. Try again.
    </p>
  }
  <div class="govuk-button-group">
    <button
      id="create_casefile_cancel_confirm"
      type="button"
      class="govuk-button govuk-!-margin-right-4"
      [class.govuk-button--warning]="!deleted()"
      [disabled]="blocked()"
      (click)="handleConfirm()"
    >
      Continue and delete all details
    </button>
    @if (!deleted()) {
      <span id="create_casefile_cancel_back">
        <opal-lib-govuk-cancel-link cancelLinkText="Go back" (linkClickEvent)="handleBack()" />
      </span>
    }
  </div>
</div>
