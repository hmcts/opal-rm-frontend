nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    FRONTEND_HOSTNAME: https://${SERVICE_FQDN}
    OPAL_MAINTENANCE_SERVICE_API_URL: http://${SERVICE_NAME}-opal-maintenance-service
    OPAL_USER_SERVICE_API_URL: https://opal-user-service.staging.platform.hmcts.net
    FEATURES_LAUNCH_DARKLY_ENABLED: true
    FEATURES_SSO_ENABLED: true
    FEATURES_IP_LOGGING_ENABLED: true
    SESSION_PREFIX: 'opal-rm-frontend-session'
    SESSION_SAME_SITE: 'none'
    SESSION_DOMAIN: '.hmcts.net'
    CSRF_SAME_SITE: 'lax'
opal-maintenance-service:
  enabled: true
  java:
    ingressHost: opal-maintenance-service-${SERVICE_FQDN}
    imagePullPolicy: Always
    keyVaults:
      opal:
        secrets:
          - name: app-insights-connection-string
            alias: app-insights-connection-string
          - name: AzureADTenantId
            alias: AAD_TENANT_ID
          - name: AzureADClientId
            alias: AAD_CLIENT_ID
          - name: AzureADClientSecret
            alias: AAD_CLIENT_SECRET
          - name: servicebus-connection-string
            alias: SERVICEBUS_CONNECTION_STRING
          - name: servicebus-logging-pdpl-queue-name
            alias: SERVICEBUS_LOGGING_PDPL_QUEUE_NAME
          - name: redis-connection-string
            alias: REDIS_CONNECTION_STRING
          - name: maintenance-service-POSTGRES-PASS
            alias: OPAL_MAINTENANCE_DB_PASSWORD
          - name: maintenance-service-POSTGRES-USER
            alias: OPAL_MAINTENANCE_DB_USERNAME
    environment:
      OPAL_MAINTENANCE_DB_HOST: "${SERVICE_NAME}-maintenance-postgresql"
      OPAL_MAINTENANCE_DB_NAME: "opal-maintenance-db"
      OPAL_MAINTENANCE_DB_PORT: "5432"
      OPAL_MAINTENANCE_DB_OPTIONS: "?stringtype=unspecified"
      RUN_DB_MIGRATION_ON_STARTUP: true
      FLYWAY_LOCATIONS: classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/stg
      TESTING_SUPPORT_ENDPOINTS_ENABLED: false
      OPAL_REDIS_ENABLED: false
      OPAL_USER_SERVICE_API_URL: https://opal-user-service.staging.platform.hmcts.net
      SERVICEBUS_LOGGING_PDPL_PROTOCOL: amqps
opal-maintenance-postgresql:
  enabled: true
  fullnameOverride: ${SERVICE_NAME}-maintenance-postgresql
  auth:
    username: opal-maintenance
    password: opal-maintenance
    database: opal-maintenance-db
  primary:
    persistence:
      enabled: false
    resourcesPreset: small
