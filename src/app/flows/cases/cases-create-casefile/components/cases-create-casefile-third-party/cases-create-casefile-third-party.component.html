<h2 class="govuk-heading-m">Third party details</h2>
<opal-lib-govuk-checkboxes [fieldSetId]="checkboxFieldsetId" legendText="">
  <div
    opal-lib-govuk-checkboxes-item
    labelText="Send correspondence to a third party"
    [inputId]="checkboxFieldName"
    [inputName]="checkboxFieldName"
    [ariaControls]="conditionalId + '-conditional'"
    [control]="form.get(checkboxFieldName)"
  ></div>
  @if (form.get(checkboxFieldName)?.value === true) {
    <div opal-lib-govuk-checkboxes-conditional [conditionalId]="conditionalId">
      <opal-lib-govuk-text-input
        labelText="Name or organisation"
        [inputId]="fieldNames.nameOrOrganisation"
        [inputName]="fieldNames.nameOrOrganisation"
        [control]="form.get(fieldNames.nameOrOrganisation)"
        [errors]="formControlErrorMessages[fieldNames.nameOrOrganisation]"
      />
      <opal-lib-govuk-text-input
        [labelText]="relationshipLabel"
        [inputId]="fieldNames.relationship"
        [inputName]="fieldNames.relationship"
        [control]="form.get(fieldNames.relationship)"
        [errors]="formControlErrorMessages[fieldNames.relationship]"
      />
      <opal-lib-govuk-text-input
        labelText="Reference"
        [inputId]="fieldNames.reference"
        [inputName]="fieldNames.reference"
        [control]="form.get(fieldNames.reference)"
        [errors]="formControlErrorMessages[fieldNames.reference]"
      />
      <opal-lib-govuk-text-input
        labelText="Address line 1"
        [inputId]="fieldNames.addressLine1"
        [inputName]="fieldNames.addressLine1"
        [control]="form.get(fieldNames.addressLine1)"
        [errors]="formControlErrorMessages[fieldNames.addressLine1]"
      />
      <opal-lib-govuk-text-input
        labelText="Address line 2"
        [inputId]="fieldNames.addressLine2"
        [inputName]="fieldNames.addressLine2"
        [control]="form.get(fieldNames.addressLine2)"
        [errors]="formControlErrorMessages[fieldNames.addressLine2]"
      />
      <opal-lib-govuk-text-input
        labelText="Address line 3"
        [inputId]="fieldNames.addressLine3"
        [inputName]="fieldNames.addressLine3"
        [control]="form.get(fieldNames.addressLine3)"
        [errors]="formControlErrorMessages[fieldNames.addressLine3]"
      />
      <opal-lib-govuk-text-input
        labelText="Address line 4"
        [inputId]="fieldNames.addressLine4"
        [inputName]="fieldNames.addressLine4"
        [control]="form.get(fieldNames.addressLine4)"
        [errors]="formControlErrorMessages[fieldNames.addressLine4]"
      />
      <opal-lib-govuk-text-input
        labelText="Address line 5"
        [inputId]="fieldNames.addressLine5"
        [inputName]="fieldNames.addressLine5"
        [control]="form.get(fieldNames.addressLine5)"
        [errors]="formControlErrorMessages[fieldNames.addressLine5]"
      />
      <opal-lib-govuk-text-input
        labelText="Postal or zip code"
        [inputId]="fieldNames.postalOrZipCode"
        [inputName]="fieldNames.postalOrZipCode"
        inputClasses="govuk-input--width-10"
        [control]="form.get(fieldNames.postalOrZipCode)"
        [errors]="formControlErrorMessages[fieldNames.postalOrZipCode]"
      />
      <opal-lib-govuk-select
        labelText="Country"
        labelClasses="govuk-label--s"
        [selectId]="fieldNames.countryId"
        [selectName]="fieldNames.countryId"
        [options]="countrySelectOptions"
        [control]="form.get(fieldNames.countryId)!"
        [errors]="formControlErrorMessages[fieldNames.countryId]"
      />
    </div>
  }
</opal-lib-govuk-checkboxes>
