<div class="govuk-grid-column-full">
  @if (removalOutcome() === 'removed') {
    <app-cases-create-casefile-removal-notification (dismissed)="handleDismissRemovalOutcome()" />
  }
  <h1 #heading id="create_casefile_order_terms_heading" tabindex="-1" class="govuk-heading-l">Order terms</h1>
  @if (cards().length === 0) {
    <p class="govuk-body">There are currently no order terms.</p>
  } @else {
    @for (card of cards(); track card.termId) {
      <section [attr.data-order-term-id]="card.termId" [attr.aria-label]="card.ariaLabel">
        <app-cases-create-casefile-order-term-card [card]="card">
          <ng-container actions>
            <li class="govuk-summary-card__action">
              <a
                class="govuk-link govuk-link--no-visited-state"
                [id]="'order-term-' + card.termId + '-change'"
                [href]="card.inputPath"
                (click)="$event.preventDefault(); handleChange(card.termId)"
              >
                <strong>Change</strong>
                <span class="govuk-visually-hidden">{{ card.title }}</span>
              </a>
            </li>
            <li class="govuk-summary-card__action">
              <a
                class="govuk-link govuk-link--no-visited-state"
                [id]="'order-term-' + card.termId + '-remove'"
                #removeLink
                [href]="card.removePath"
                (click)="handleRemove($event, card.termId)"
              >
                <strong>Remove</strong>
                <span class="govuk-visually-hidden">{{ card.title }}</span>
              </a>
            </li>
          </ng-container>
        </app-cases-create-casefile-order-term-card>
      </section>
    }
  }
  <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible" />
  <div class="govuk-button-group">
    <button class="govuk-button" id="create_casefile_order_terms_return" type="button" (click)="handleBack()">
      Return to case details
    </button>
    <button
      class="govuk-button govuk-button--secondary"
      id="create_casefile_order_terms_add"
      type="button"
      (click)="handleAddTerms()"
    >
      Add terms
    </button>
  </div>
</div>
