<div class="govuk-grid-column-full">
  <a id="cases-draft-all-rejected-back" class="govuk-back-link" [href]="backHref()" (click)="backToYourCases($event)">{{
    copy.back
  }}</a>
  @if (successText(); as message) {
    <div
      opal-lib-moj-alert
      id="cases-draft-all-rejected-success"
      type="success"
      [ariaLabel]="message"
      [showDismiss]="true"
      (dismissed)="dismissSuccess()"
    >
      <opal-lib-moj-alert-icon icon type="success" />
      <opal-lib-moj-alert-content content>
        <opal-lib-moj-alert-content-text>{{ message }}</opal-lib-moj-alert-content-text>
      </opal-lib-moj-alert-content>
    </div>
  }
  <h1 #heading id="cases-draft-all-rejected-heading" class="govuk-heading-l" tabindex="-1">{{ copy.heading }}</h1>
  @if (casefiles(); as current) {
    @if (current.rows.length) {
      <app-cases-draft-table
        presentation="all-rejected"
        [rows]="current.rows"
        [selection]="tableSelection()"
        (sortChanged)="changeSort($event)"
        (pageChanged)="changePage($event)"
        (rowOpened)="openRow($event)"
      />
    } @else {
      <p id="cases-draft-all-rejected-empty" class="govuk-body">{{ copy.empty }}</p>
    }
  }
</div>
