apiVersion: v2
appVersion: "1.0"
description: A Helm chart for opal-rm-frontend
name: opal-rm-frontend
home: https://github.com/hmcts/opal-rm-frontend/
version: 0.0.34
maintainers:
  - name: HMCTS Opal team
dependencies:
  - name: nodejs
    version: 3.2.1
    repository: "oci://hmctsprod.azurecr.io/helm"
  - name: redis
    version: 28.0.2
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
  - name: postgresql
    version: 18.8.7
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: opal-maintenance-service
    version: 0.0.18
    repository: "oci://hmctsprod.azurecr.io/helm"
    condition: opal-maintenance-service.enabled
